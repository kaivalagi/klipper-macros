[gcode_macro START_PRINT]
description:
  "G-code to run at the start of a print.
  Replace your slicer's start G-code with this.
  Examples:
    Cura: START_PRINT BED=[first_layer_bed_temperature] HOTEND=[first_layer_temperature_0] PROBE=true
      Use search/replace post processing for print area via print_start_set macro: search = (\n;(MIN|MAX)X:([^\n]+)\n;\2Y:([^\n]+)) ,replace = PRINT_START_SET MESH_\2=\3,\4
    Prusa: START_PRINT BED=[first_layer_bed_temperature] HOTEND={first_layer_temperature[initial_extruder]+extruder_temperature_offset[initial_extruder]} PROBE=true PROBE_AREA_START={first_layer_print_min[0]},{first_layer_print_min[1]} PROBE_AREA_END={first_layer_print_max[0]},{first_layer_print_max[1]} FILAMENT=[filament_type[0]]
    Orca Slicer: START_PRINT BED=[bed_temperature_initial_layer] HOTEND=[nozzle_temperature_initial_layer] PROBE=true PROBE_AREA_START={first_layer_print_min[0]},{first_layer_print_min[1]} PROBE_AREA_END={first_layer_print_max[0]},{first_layer_print_max[1]}  FILAMENT={filament_type[0]}
  @param {int} [HOTEND=200] - The target hotend temp
  @param {int} [BED=60] - The target bed temp
  @param {bool} [RELATIVE_E_MODE=false] - Whether the extruder should be in relative mode
  @param {bool} [PROBE=false] - Whether or not to build a new bed mesh
  @param {int,int} [PROBE_AREA_START=min,min] - Start of area to mesh
  @param {int,int} [PROBE_AREA_END=max,max] - End of area to mesh
  @param {int} [HOTEND_PREHEAT_PERCENT=75] - Percentage of hotend temp to pre-heat to before bed mesh
  @param {string} [FILAMENT=""] - Filament type name (e.g. PLA, TPU, PETG)"  
gcode:
  {% set hotend_temp = params.HOTEND|default(200)|int %}
  {% set bed_temp = params.BED|default(60)|int %}
  {% set relative_extruder = params.RELATIVE_E_MODE|default(false)|string %}
  {% set probe = params.PROBE|default(false)|string %}
  {% set hotend_preheat_percent = params.HOTEND_PREHEAT_PERCENT|default(75)|int %}
  {% set settings = printer["gcode_macro PRINT_START_SET"].settings %}
  {% set probe_area_start = params.PROBE_AREA_START|default(settings.MESH_MIN)|default(printer.toolhead.axis_minimum.x,printer.toolhead.axis_minimum.y)|default(None) %}
  {% set probe_area_end = params.PROBE_AREA_END|default(settings.MESH_MAX)|default(printer.toolhead.axis_maximum.x,printer.toolhead.axis_maximum.y)|default(None) %}
  {% set layers = params.LAYERS|default(settings.LAYERS)|default(0)|int %}
  {% set filament = params.FILAMENT|default("")|lower %}

  # defaults
  {% set hotend_preheat_temp = (hotend_temp * hotend_preheat_percent / 100)|int %}
  {% set bed_min_temp = (bed_temp - 2)|int %}
  {% set bed_max_temp = (bed_temp * 1.02)|int %}
  {% set hotend_min_temp = (hotend_temp - 1)|int %}
  {% set hotend_max_temp = (hotend_temp + 1)|int %}
  
  # ── Filament-specific overrides ──
  {% if "tpu" in filament %}
    {% set filament = "tpu" %}
    {% set bed_max_temp = (bed_temp * 1.2)|int %}
  {% elif "petg" in filament %}
    {% set filament = "petg" %}
  {% elif "pla" in filament %}
    {% set filament = "pla" %}
  {% else %}
    {% set filament = "" %}
  {% endif %}

  {% set x_start = printer.toolhead.axis_minimum.x + 5 %}
  {% set y_start = printer.toolhead.axis_minimum.y + 20 %}
  

  RESPOND TYPE=command MSG="Filament detected: {filament}"
  RESPOND TYPE=command MSG="Heating bed to {bed_temp}, wait range: {bed_min_temp} to {bed_max_temp}"
  M140 S{bed_temp} ;Start heating bed

  G21 ; set units to millimeters
  G90 ; use absolute coordinates

  M220 S100 ;Reset feedrate
  M221 S100 ;Reset flowrate
  {% if relative_extruder|lower == 'true' %}
    M83 ;Set extruder to relative mode
  {% else %}
    M82 ;Set extruder to absolute mode
  {% endif %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
  {% endif %}

  RESPOND TYPE=command MSG="Preheating hotend to {hotend_preheat_temp}"
  M104 S{hotend_preheat_temp}  ;Start preheating hotend (non-blocking)

  {% if printer.heater_bed.temperature < bed_min_temp or printer.heater_bed.temperature > bed_max_temp %}
    RESPOND TYPE=command MSG="Waiting on bed temp range: {bed_min_temp} to {bed_max_temp}"
  {% endif %}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_min_temp} MAXIMUM={bed_max_temp}

  {% if probe|lower == 'true' %}
    BED_MESH_CALIBRATE PROFILE=minimal AREA_START={probe_area_start} AREA_END={probe_area_end}
  {% else %}
	  BED_MESH_PROFILE LOAD=default
  {% endif %}

  # move to front left to help clearing any oozing
  G1 Z30.0 F3000 ;Move Z axis up
  G1 X{x_start} Y{y_start} F5000.0 ;Move tool to XY pos

  RESPOND TYPE=command MSG="Heating hotend to {hotend_temp}, wait range: {hotend_min_temp} to {hotend_max_temp}"
  M104 S{hotend_temp} ;Set full hotend temp (non-blocking)
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotend_min_temp} MAXIMUM={hotend_max_temp}

  RESPOND TYPE=command MSG="Printing nozzle prime line..."
  NOZZLE_PRIME_LINE

  RESPOND TYPE=command MSG="Proceeding to print..."

[gcode_macro PRINT_START_SET]
description: Inserted by slicer to set values used by PRINT_START.
  Usage: PRINT_START_SET <VARIABLE>=<value>
variable_settings: {}
gcode:
  {%for k in params %}
    {% set dummy = settings.__setitem__(k|upper, params[k]) %}
  {% endfor %}
